<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFCF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#28241F" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Hedge fund stock holdings and analysis based on SEC data." />
    <title>Orca: Hedge fund holdings</title>
    <!-- The Orca mark (docs/brand). The SVG turns light on dark browser tabs; the PNG is for browsers without SVG icons. -->
    <!-- Google picks a site icon in multiples of 48 px (48, 96, 144, 192...), so 48 and 192 are listed; favicon.ico is the fallback every crawler asks for. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/assets/fonts/instrument-sans-latin-wght-normal.woff2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
