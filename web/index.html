<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFCF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#28241F" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Orca turns 13F filings into estimated results for the big funds, stock by stock." />
    <title>Orca</title>
    <!-- Link previews. The build adds the absolute og:image (and og:url on fund pages) from SITE_URL: scripts/prerender.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orca" />
    <meta property="og:title" content="Orca" />
    <meta property="og:description" content="Orca turns 13F filings into estimated results for the big funds, stock by stock." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The Orca mark (docs/brand). The SVG turns light on dark browser tabs; the PNG is for browsers without SVG icons. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/assets/fonts/instrument-sans-latin-wght-normal.woff2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
