name: People photos

# Fetches free-licensed photos of the people behind the famous funds (Wikimedia Commons: public
# domain, CC0, CC BY, CC BY-SA) into web/src/assets/people/ and commits them to the branch the
# workflow was run on. Run it from a branch, never from the default branch: it refuses, because a
# commit there deploys the site. Then merge that branch (a pull request) when you are happy.
#
# It only adds people who have no photo yet, so photos replaced by hand are kept. The input
# `refresh` fetches everyone again (and overwrites the hand-replaced ones). Wikimedia limits how
# fast it hands out files, so the script waits and retries; a full run can take an hour or more.
# It uses no secrets. See web/src/assets/people/README.md and pipeline/scripts/fetch_people_images.py.

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch everyone again, replacing photos already there (hand-replaced ones too)
        type: boolean
        default: false

concurrency:
  group: people-photos
  cancel-in-progress: false

permissions:
  contents: write # to commit the photos to this branch

jobs:
  photos:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Refuse the default branch
        env:
          REF: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" = "$DEFAULT" ]; then
            echo "::error::run this from a branch other than $DEFAULT (committing to $DEFAULT deploys the site); in the Run workflow box pick a branch"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # the commit step pushes with it
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.13"
      - name: Fetch the photos
        env:
          REFRESH: ${{ inputs.refresh }}
        run: |
          set -o pipefail # a crashed script must fail the step, not hide behind tee
          args=()
          if [ "$REFRESH" = "true" ]; then args+=(--refresh); fi
          # No project install: the script needs only these packages. OpenCV is pinned to 4.10 (5.x dropped the face finder it uses).
          uv run --no-project --with httpx --with pillow --with "opencv-python-headless==4.10.0.84" \
            python pipeline/scripts/fetch_people_images.py "${args[@]}" 2>&1 | tee fetch.log
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### People photos"
            echo
            echo '```'
            grep -E "photos saved|^WHY " fetch.log || echo "no summary (the run stopped early; see the log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the photos to this branch
        # Also after a failed fetch: the script saves after every photo, so what it got is kept.
        if: ${{ !cancelled() }}
        env:
          REF: ${{ github.ref_name }}
        run: |
          git add web/src/assets/people
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "web: people photos from Wikimedia Commons" \
            -m "Fetched by the People photos workflow (pipeline/scripts/fetch_people_images.py)."
          # Someone may have pushed to the branch while this ran.
          git pull --rebase origin "$REF"
          git push origin "HEAD:$REF"
