name: Site CORS

# Lets the website read the public data bucket from the browser: sets the CORS policy of the site
# bucket (R2_SITE_BUCKET) to allow GET and HEAD from the site's address and the local dev server,
# through R2's S3 API with the pipeline's R2 credentials, then reads it back. Run it by hand
# (Actions > Site CORS > Run workflow) after the site's address changes. The credentials need
# admin rights on the bucket; with object rights only, R2 refuses and the step says so.
#
# Origins: the repository variable SITE_ORIGINS (space-separated), else the default below.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cors:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Set and check the CORS policy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_SITE_BUCKET }}
          SITE_ORIGINS: ${{ vars.SITE_ORIGINS || 'https://orca-eiq.pages.dev http://localhost:5173' }}
          AWS_DEFAULT_REGION: auto
          # R2 does not take every checksum header newer AWS CLIs send by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT CLOUDFLARE_ACCOUNT_ID; do
            export "$v=${!v//[[:space:]]/}"
          done
          if [ -z "$BUCKET" ]; then
            echo "::error::set the repository variable R2_SITE_BUCKET"
            exit 1
          fi
          # Whether the website (Pages) and the data (R2) live in the same Cloudflare account.
          data_account="$(sed -E 's#^https?://([0-9a-f]{32})\..*#\1#' <<<"$R2_ENDPOINT")"
          if [ "$data_account" = "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::the website and the data buckets are in the same Cloudflare account"
          else
            echo "::notice::the website and the data buckets are in DIFFERENT Cloudflare accounts (R2_ENDPOINT's account is not CLOUDFLARE_ACCOUNT_ID)"
          fi
          origins="$(jq -cn --arg o "$SITE_ORIGINS" '$o | split(" ") | map(select(length > 0))')"
          jq -n --argjson origins "$origins" '{CORSRules: [{
            AllowedOrigins: $origins, AllowedMethods: ["GET", "HEAD"],
            AllowedHeaders: ["*"], MaxAgeSeconds: 86400}]}' > "$RUNNER_TEMP/cors.json"
          cat "$RUNNER_TEMP/cors.json"
          if ! aws s3api put-bucket-cors --endpoint-url "$R2_ENDPOINT" --bucket "$BUCKET" \
              --cors-configuration "file://$RUNNER_TEMP/cors.json"; then
            echo "::error::R2 refused to set the CORS policy of '$BUCKET'. The R2 API token most likely has object rights only: set the policy in the Cloudflare dashboard (R2 > $BUCKET > Settings > CORS Policy), or give a token Admin Read & Write and update R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY."
            exit 1
          fi
          echo "The policy R2 now holds:"
          aws s3api get-bucket-cors --endpoint-url "$R2_ENDPOINT" --bucket "$BUCKET"
