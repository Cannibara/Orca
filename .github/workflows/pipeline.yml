name: Pipeline

# Weekly: restore the lake from the private R2 bucket, ingest new filings and prices, recompute the
# funds they touch, upload the changed files to the public R2 bucket (manifest.json last), save the
# lake back. Monthly: rebuild a sample of funds from the lake's raw filings and compare them with
# what is published. A failed run leaves the site on the last good version; GitHub's default
# notifications email the failure.
#
# The R2 credentials can write the private lake (it holds CUSIPs) and the public site, so only the
# steps that run rclone get them (the restore-r2 action and the two upload steps below): not the
# third-party actions, the dependency install or the pipeline process. Both jobs run in the
# `production` environment. In Settings > Environments, restrict it to the default branch (deployment
# branches) and keep the R2 secrets there.

on:
  schedule:
    - cron: "23 6 * * 0" # weekly run: Sundays 06:23 UTC
    - cron: "41 7 1 * *" # monthly check: the 1st of each month, 07:41 UTC
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild everything (recompute and republish every fund)
        type: boolean
        default: false

# One run at a time, and a run in progress is never cancelled: it reads the lake from R2 and writes
# it back, so two at once would lose work.
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: pipeline

env:
  # rclone reads its "r2" remote from these (the credentials are added per step). The lake bucket
  # holds CUSIPs and is never public; the site bucket is the public one.
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true" # an object-only R2 token cannot create buckets
  RCLONE_TRANSFERS: "16"
  RCLONE_CHECKERS: "16"
  R2_LAKE_BUCKET: ${{ vars.R2_LAKE_BUCKET }}
  R2_SITE_BUCKET: ${{ vars.R2_SITE_BUCKET }}
  ORCA_LAKE_DIR: data/lake
  ORCA_OUT_DIR: data/out

jobs:
  weekly:
    # These strings must equal the cron entries above.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 6 * * 0'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.13"
      - uses: ./.github/actions/setup-rclone
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - uses: ./.github/actions/restore-r2
        with:
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}
      - name: Run the pipeline
        env:
          ORCA_COMMAND: ${{ inputs.full && 'rebuild' || 'weekly' }}
          ORCA_CONTACT: ${{ secrets.ORCA_CONTACT }}
          OPENFIGI_KEY: ${{ secrets.OPENFIGI_KEY }}
          TIINGO_KEY: ${{ secrets.TIINGO_KEY }}
          TIINGO_RATE_PER_SEC: ${{ vars.TIINGO_RATE_PER_SEC }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: uv run --locked --no-dev python -m orca.run "$ORCA_COMMAND"
      - name: Upload the changed files, then the manifest
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # The run stages only the files that changed; the newest folder is this run's.
          staging="$(find data/out/staging -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          if [ -z "$staging" ]; then
            echo "::error::the run left no staging folder"
            exit 1
          fi
          headers=(
            --header-upload "Content-Encoding: br"
            --header-upload "Content-Type: application/json"
            --header-upload "Cache-Control: public, max-age=300"
          )
          rclone copy "$staging" "r2:${R2_SITE_BUCKET}" --include "*.json" --ignore-times "${headers[@]}"
          # Last, so a reader never finds a manifest that names a file not yet uploaded.
          rclone copyto data/out/manifest.json "r2:${R2_SITE_BUCKET}/manifest.json" --ignore-times "${headers[@]}"
      - name: Save the lake
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: rclone sync data/lake "r2:${R2_LAKE_BUCKET}"

  verify:
    # These strings must equal the cron entries above.
    if: github.event.schedule == '41 7 1 * *'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.13"
      - uses: ./.github/actions/setup-rclone
      - name: Install dependencies
        run: uv sync --locked --no-dev
      # verify rebuilds funds from the lake's raw filings and compares their files' checksums with
      # the lake's published.json (the manifest, when the lake has none): nothing else is needed,
      # and it calls no API.
      - uses: ./.github/actions/restore-r2
        with:
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}
      - name: Rebuild a sample of funds and compare
        run: uv run --locked --no-dev python -m orca.run verify --sample 50
