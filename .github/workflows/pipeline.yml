name: Pipeline

# Monthly, on the 16th (the day after the latest 13F deadline of Feb 14, May 15, Aug 14 and Nov 14,
# so each quarter's filings are in at once): restore the lake from the private R2 bucket, ingest
# new filings and prices, recompute the funds they touch, upload the changed files to the public R2
# bucket (manifest.json last), clear the Cloudflare cache of the data site, save the lake back. On the
# 1st: rebuild a sample of funds from the lake's raw filings and compare them with what is published.
# A failed run leaves the site on the last good version. A failed scheduled run (the run or the
# monthly check) also opens a GitHub issue (the `alert` job at the end).
#
# Every run has a time budget (ORCA_TIME_BUDGET_MIN, 270 minutes by default): when it is spent the
# pipeline stops its long stages cleanly, publishes the funds it computed (nothing, if it got no
# further than the downloads) and exits successfully; the lake is saved whatever happened, so the
# next run goes on from there. The pipeline step's own timeout (300) and the job's (330) leave time
# for the save.
#
# Bootstrapping: an empty lake needs more than one run (years of bulk ZIPs, CUSIP lookups and
# price histories). Leave the schedule off (repository variable ORCA_SCHEDULE_ENABLED unset) and
# start the workflow by hand (Actions > Pipeline > Run workflow) again after each run finishes,
# until a run's health.json has no "time_budget" flag. Then set ORCA_SCHEDULE_ENABLED to "true":
# the cron entries below do nothing until it is.
#
# The R2 credentials can write the private lake (it holds CUSIPs) and the public site, so only the
# steps that run rclone get them (the restore-r2 action and the two upload steps below): not the
# third-party actions, the dependency install or the pipeline process. Both jobs run in the
# `production` environment. In Settings > Environments, restrict it to the default branch (deployment
# branches) and keep the R2 secrets there.
#
# The data site (data.orcaetf.com) sits behind Cloudflare's cache, which keeps a file for up to 30
# days while the files are overwritten monthly under the same names. After the upload the pipeline
# therefore clears that cache (the secret CF_PURGE_TOKEN, an API token that may only purge the cache,
# and the variable CF_ZONE_ID, both in the `production` environment). Until both exist the step is
# skipped with a notice. The Purge cache workflow does the same by hand.

on:
  schedule:
    - cron: "23 6 16 * *" # the run: the 16th of each month, 06:23 UTC
    - cron: "41 7 1 * *" # monthly check: the 1st of each month, 07:41 UTC
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild everything (recompute and republish every fund)
        type: boolean
        default: false
      home_only:
        description: Home lists only (republish them from the stored funds; no fetch, no recompute)
        type: boolean
        default: false

# One run at a time, and a run in progress is never cancelled: it reads the lake from R2 and writes
# it back, so two at once would lose work.
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: pipeline

env:
  # rclone reads its "r2" remote from these (the credentials are added per step). The lake bucket
  # holds CUSIPs and is never public; the site bucket is the public one.
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true" # an object-only R2 token cannot create buckets
  RCLONE_TRANSFERS: "16"
  RCLONE_CHECKERS: "16"
  # A transfer that stalls is dropped after a minute and tried again (the default waits five
  # minutes in silence), and every transfer prints its progress every 30 seconds.
  RCLONE_TIMEOUT: 60s
  RCLONE_CONTIMEOUT: 15s
  RCLONE_STATS: 30s
  RCLONE_STATS_ONE_LINE: "true"
  RCLONE_STATS_LOG_LEVEL: NOTICE
  R2_LAKE_BUCKET: ${{ vars.R2_LAKE_BUCKET }}
  R2_SITE_BUCKET: ${{ vars.R2_SITE_BUCKET }}
  ORCA_LAKE_DIR: data/lake
  ORCA_OUT_DIR: data/out

jobs:
  weekly:
    # These strings must equal the cron entries above.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.schedule == '23 6 16 * *' && vars.ORCA_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.13"
      - uses: ./.github/actions/setup-rclone
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Check the API keys
        # One test request each, so a wrong key fails here in seconds, not after the bulk ingest.
        env:
          OPENFIGI_KEY: ${{ secrets.OPENFIGI_KEY }}
          TIINGO_KEY: ${{ secrets.TIINGO_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: uv run --locked --no-dev python -m orca.run check-keys
      - id: restore
        uses: ./.github/actions/restore-r2
        with:
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}
      - name: Run the pipeline
        timeout-minutes: 300
        env:
          ORCA_COMMAND: ${{ inputs.home_only && 'home' || (inputs.full && 'rebuild' || 'weekly') }}
          ORCA_TIME_BUDGET_MIN: ${{ vars.ORCA_TIME_BUDGET_MIN || '270' }}
          ORCA_CONTACT: ${{ secrets.ORCA_CONTACT }}
          OPENFIGI_KEY: ${{ secrets.OPENFIGI_KEY }}
          TIINGO_KEY: ${{ secrets.TIINGO_KEY }}
          TIINGO_RATE_PER_SEC: ${{ vars.TIINGO_RATE_PER_SEC }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: |
          # If memory runs out, the kernel kills the pipeline rather than the runner, so the lake
          # is still saved (a runner that dies takes the save step with it).
          echo 1000 > /proc/self/oom_score_adj
          # Memory and disk every minute, so a run that dies shows how close it came.
          (
            while sleep 60; do
              echo "resources: memory $(free -m | awk 'NR==2 {print $3 " of " $2 " MB"}'), disk $(df -h --output=used,avail . | tail -n 1 | xargs) used/free"
            done
          ) &
          monitor=$!
          trap 'kill "$monitor"' EXIT
          uv run --locked --no-dev python -m orca.run "$ORCA_COMMAND"
      - name: Upload the changed files, then the manifest
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # Secrets pasted with a trailing line break or space break the Authorization header: strip them.
          for v in RCLONE_CONFIG_R2_ACCESS_KEY_ID RCLONE_CONFIG_R2_SECRET_ACCESS_KEY RCLONE_CONFIG_R2_ENDPOINT; do
            export "$v=${!v//[[:space:]]/}"
          done
          # The run stages only the files that changed; the newest folder is this run's (the
          # runner starts without one). A run whose time budget ran out before it computed any
          # fund publishes nothing and makes no folder.
          staging=""
          if [ -d data/out/staging ]; then
            staging="$(find data/out/staging -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          fi
          if [ -z "$staging" ]; then
            echo "::notice::nothing to upload: the time budget ran out before any fund was computed"
            exit 0
          fi
          headers=(
            --header-upload "Content-Encoding: br"
            --header-upload "Content-Type: application/json"
            --header-upload "Cache-Control: public, max-age=300"
          )
          # The first runs upload tens of thousands of small files: run many at once, and skip the
          # HEAD request rclone makes after each upload (the PUT's answer already confirms it).
          rclone copy "$staging" "r2:${R2_SITE_BUCKET}" --include "*.json" --ignore-times \
            --transfers 64 --checkers 64 --s3-no-head "${headers[@]}"
          # Last, so a reader never finds a manifest that names a file not yet uploaded.
          rclone copyto data/out/manifest.json "r2:${R2_SITE_BUCKET}/manifest.json" --ignore-times "${headers[@]}"
      - name: Clear the Cloudflare cache
        # Only after the upload succeeded (a failed upload leaves the cache holding the old, consistent
        # files). A failure here fails the run, but the next step runs whatever happens to this one.
        env:
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
        run: |
          # No `set -x` in this step: it handles the token.
          # Values pasted with a trailing line break or space break the request: strip them.
          token="${CF_PURGE_TOKEN//[[:space:]]/}"
          zone="${CF_ZONE_ID//[[:space:]]/}"
          missing=""
          [ -n "$token" ] || missing="the secret CF_PURGE_TOKEN"
          [ -n "$zone" ] || missing="${missing:+$missing and }the variable CF_ZONE_ID"
          if [ -n "$missing" ]; then
            echo "::notice::The Cloudflare cache was not cleared. Missing in the production environment: ${missing}. Until they are set, data.orcaetf.com can serve the previous files from its cache for up to 30 days (see docs/domain-and-data-hosting.md)."
            exit 0
          fi
          if [[ ! "$zone" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CF_ZONE_ID should be the zone ID of orcaetf.com: 32 characters, 0-9 and a-f (it is ${#zone} characters). The Cloudflare dashboard shows it on the right-hand side of the domain's Overview page."
            exit 1
          fi
          if [[ ! "$token" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::CF_PURGE_TOKEN has characters other than letters, digits, - and _ (it is ${#token} characters): it is not a Cloudflare API token. Create a new token and paste only the token."
            exit 1
          fi
          response="$RUNNER_TEMP/cloudflare-purge.json"
          rm -f "$response"
          status="$(curl --silent --show-error --max-time 60 --retry 3 \
            --request POST --header "Authorization: Bearer ${token}" --header "Content-Type: application/json" \
            --data '{"purge_everything":true}' --output "$response" --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/zones/${zone}/purge_cache")" || status=000
          if [[ "$status" =~ ^2[0-9][0-9]$ ]] && jq -e '.success == true' "$response" > /dev/null 2>&1; then
            echo "The Cloudflare cache is cleared."
            exit 0
          fi
          echo "::error::Cloudflare did not clear the cache (HTTP ${status})."
          # Cloudflare's own reasons: {"success": false, "errors": [{"code": 10000, "message": "..."}]}
          if ! jq -r '.errors[]? | "::error::Cloudflare error \(.code): \(.message | tostring | gsub("[\r\n]+"; " "))"' "$response" 2> /dev/null; then
            echo "::error::Cloudflare's answer was not JSON, or there was no answer: $(head -c 300 "$response" 2> /dev/null | tr -d '\r\n')"
          fi
          if [ "$status" = 401 ] || [ "$status" = 403 ]; then
            echo "::error::The token is wrong, expired, or lacks the permission Zone > Cache Purge > Purge for the zone orcaetf.com. Create a new token with only that permission and update the secret CF_PURGE_TOKEN."
          fi
          echo "::error::Once that is fixed, run Actions > Purge cache > Run workflow to clear the cache by hand."
          exit 1
      - name: Save the lake
        # Also after a failed, cancelled or timed-out step: what the run stored is progress, and the
        # lake's state says what is still owed. If the upload did not complete, the lake's
        # published.json is ahead of the site: the next run compares it with the site's manifest
        # (which the restore brings) and republishes what the site lacks. Never when the restore
        # did not complete (a partial lake must not overwrite the bucket).
        if: always() && steps.restore.outcome == 'success'
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # Secrets pasted with a trailing line break or space break the Authorization header: strip them.
          for v in RCLONE_CONFIG_R2_ACCESS_KEY_ID RCLONE_CONFIG_R2_SECRET_ACCESS_KEY RCLONE_CONFIG_R2_ENDPOINT; do
            export "$v=${!v//[[:space:]]/}"
          done
          # A cancelled run leaves the pipeline running: stop it first, so it cannot write to the
          # lake while the lake is being saved.
          if pgrep -f "[-]m orca[.]run" > /dev/null; then
            echo "::notice::stopping the pipeline that is still running"
            pkill -TERM -f "[-]m orca[.]run" || true
            for _ in $(seq 30); do pgrep -f "[-]m orca[.]run" > /dev/null || break; sleep 1; done
            pkill -KILL -f "[-]m orca[.]run" || true
          fi
          echo "lake: $(find data/lake -type f | wc -l) files, $(du -sh data/lake | cut -f1)"
          # Data first, bookkeeping last: the JSON files (state.json, ingested.json, published.json)
          # say what the data holds, so a save cut off half way leaves old bookkeeping over newer
          # data (work redone next run), never bookkeeping that claims data the bucket lacks.
          # Temporary files that a killed write left behind are not saved.
          # workbooks/** lives only in the bucket (the Workbook workflow): excluded here as on
          # restore, or this sync would delete it.
          rclone sync data/lake "r2:${R2_LAKE_BUCKET}" --exclude "*.json" --exclude "*.tmp" --exclude "workbooks/**"
          rclone copy data/lake "r2:${R2_LAKE_BUCKET}" --include "*.json"

  verify:
    # These strings must equal the cron entries above.
    if: github.event.schedule == '41 7 1 * *' && vars.ORCA_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.13"
      - uses: ./.github/actions/setup-rclone
      - name: Install dependencies
        run: uv sync --locked --no-dev
      # verify rebuilds funds from the lake's raw filings and compares their files' checksums with
      # the lake's published.json (the manifest, when the lake has none): nothing else is needed,
      # and it calls no API.
      - uses: ./.github/actions/restore-r2
        with:
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}
      - name: Rebuild a sample of funds and compare
        run: uv run --locked --no-dev python -m orca.run verify --sample 50

  alert:
    # A failed scheduled run (the monthly run or the 1st's check) opens an issue, so the failure is
    # seen without anyone watching Actions. It also keeps the schedule from going unnoticed:
    # public-repo schedules switch off after 60 days without activity. Holds no secrets and
    # checks nothing out; the issue says only where to look.
    needs: [weekly, verify]
    if: >-
      always() && github.event_name == 'schedule' &&
      (needs.weekly.result == 'failure' || needs.verify.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          REF: ${{ github.ref }}
        run: |
          title="Pipeline failed: ${RUN_ID}"
          body="$(printf 'Run: %s\nWorkflow: %s\nRef: %s\nDate: %s\n' "$RUN_URL" "$WORKFLOW" "$REF" "$(date -u +%F)")"
          # A re-run of the same run (same id) comments on the issue it already has.
          number="$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
