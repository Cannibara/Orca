name: Pipeline

# Weekly: restore the lake from the private R2 bucket, ingest new filings and prices, recompute the
# funds they touch, upload the changed files to the public R2 bucket (manifest.json last), save the
# lake back. Monthly: rebuild a sample of funds from the lake's raw filings and compare them with
# what is published. A failed run leaves the site on the last good version; GitHub's default
# notifications email the failure.
#
# Every run has a time budget (ORCA_TIME_BUDGET_MIN, 270 minutes by default): when it is spent the
# pipeline stops its long stages cleanly, publishes the funds it computed (nothing, if it got no
# further than the downloads) and exits successfully; the lake is saved whatever happened, so the
# next run goes on from there. The pipeline step's own timeout (300) and the job's (330) leave time
# for the save.
#
# Bootstrapping: an empty lake needs more than one run (years of bulk ZIPs, CUSIP lookups and
# price histories). Leave the schedule off (repository variable ORCA_SCHEDULE_ENABLED unset) and
# start the workflow by hand (Actions > Pipeline > Run workflow) again after each run finishes,
# until a run's health.json has no "time_budget" flag. Then set ORCA_SCHEDULE_ENABLED to "true":
# the cron entries below do nothing until it is.
#
# The R2 credentials can write the private lake (it holds CUSIPs) and the public site, so only the
# steps that run rclone get them (the restore-r2 action and the two upload steps below): not the
# third-party actions, the dependency install or the pipeline process. Both jobs run in the
# `production` environment. In Settings > Environments, restrict it to the default branch (deployment
# branches) and keep the R2 secrets there.

on:
  schedule:
    - cron: "23 6 * * 0" # weekly run: Sundays 06:23 UTC
    - cron: "41 7 1 * *" # monthly check: the 1st of each month, 07:41 UTC
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild everything (recompute and republish every fund)
        type: boolean
        default: false

# One run at a time, and a run in progress is never cancelled: it reads the lake from R2 and writes
# it back, so two at once would lose work.
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: pipeline

env:
  # rclone reads its "r2" remote from these (the credentials are added per step). The lake bucket
  # holds CUSIPs and is never public; the site bucket is the public one.
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true" # an object-only R2 token cannot create buckets
  RCLONE_TRANSFERS: "16"
  RCLONE_CHECKERS: "16"
  R2_LAKE_BUCKET: ${{ vars.R2_LAKE_BUCKET }}
  R2_SITE_BUCKET: ${{ vars.R2_SITE_BUCKET }}
  ORCA_LAKE_DIR: data/lake
  ORCA_OUT_DIR: data/out

jobs:
  weekly:
    # These strings must equal the cron entries above.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.schedule == '23 6 * * 0' && vars.ORCA_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.13"
      - uses: ./.github/actions/setup-rclone
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - id: restore
        uses: ./.github/actions/restore-r2
        with:
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}
      - name: Run the pipeline
        timeout-minutes: 300
        env:
          ORCA_COMMAND: ${{ inputs.full && 'rebuild' || 'weekly' }}
          ORCA_TIME_BUDGET_MIN: ${{ vars.ORCA_TIME_BUDGET_MIN || '270' }}
          ORCA_CONTACT: ${{ secrets.ORCA_CONTACT }}
          OPENFIGI_KEY: ${{ secrets.OPENFIGI_KEY }}
          TIINGO_KEY: ${{ secrets.TIINGO_KEY }}
          TIINGO_RATE_PER_SEC: ${{ vars.TIINGO_RATE_PER_SEC }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: uv run --locked --no-dev python -m orca.run "$ORCA_COMMAND"
      - name: Upload the changed files, then the manifest
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # The run stages only the files that changed; the newest folder is this run's (the
          # runner starts without one). A run whose time budget ran out before it computed any
          # fund publishes nothing and makes no folder.
          staging=""
          if [ -d data/out/staging ]; then
            staging="$(find data/out/staging -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          fi
          if [ -z "$staging" ]; then
            echo "::notice::nothing to upload: the time budget ran out before any fund was computed"
            exit 0
          fi
          headers=(
            --header-upload "Content-Encoding: br"
            --header-upload "Content-Type: application/json"
            --header-upload "Cache-Control: public, max-age=300"
          )
          rclone copy "$staging" "r2:${R2_SITE_BUCKET}" --include "*.json" --ignore-times "${headers[@]}"
          # Last, so a reader never finds a manifest that names a file not yet uploaded.
          rclone copyto data/out/manifest.json "r2:${R2_SITE_BUCKET}/manifest.json" --ignore-times "${headers[@]}"
      - name: Save the lake
        # Also after a failed, cancelled or timed-out step: what the run stored is progress, and the
        # lake's state says what is still owed. Never when the restore did not complete (a partial
        # lake must not overwrite the bucket).
        if: always() && steps.restore.outcome == 'success'
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # Data first, bookkeeping last: the JSON files (state.json, ingested.json, published.json)
          # say what the data holds, so a save cut off half way leaves old bookkeeping over newer
          # data (work redone next run), never bookkeeping that claims data the bucket lacks.
          # Temporary files that a killed write left behind are not saved.
          rclone sync data/lake "r2:${R2_LAKE_BUCKET}" --exclude "*.json" --exclude "*.tmp"
          rclone copy data/lake "r2:${R2_LAKE_BUCKET}" --include "*.json"

  verify:
    # These strings must equal the cron entries above.
    if: github.event.schedule == '41 7 1 * *' && vars.ORCA_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.13"
      - uses: ./.github/actions/setup-rclone
      - name: Install dependencies
        run: uv sync --locked --no-dev
      # verify rebuilds funds from the lake's raw filings and compares their files' checksums with
      # the lake's published.json (the manifest, when the lake has none): nothing else is needed,
      # and it calls no API.
      - uses: ./.github/actions/restore-r2
        with:
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.R2_ENDPOINT }}
      - name: Rebuild a sample of funds and compare
        run: uv run --locked --no-dev python -m orca.run verify --sample 50
