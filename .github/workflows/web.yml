name: Web

# Every push and pull request that touches the site runs its tests: the Vitest suite, a build
# against the demo data, and the Playwright smoke tests against that build (home, fund and
# position pages, the methodology and a not-found page, 1280 and 400 px wide, light and dark). When
# the smoke tests fail, their report and traces are attached to the run as an artifact.
#
# A push to the default branch then builds the real site and deploys it to Cloudflare Pages
# (project "orca"). The build reads its data from the repository variable VITE_DATA_URL (the
# public R2 site bucket, which needs a CORS rule allowing GET from the Pages domain) and
# pre-renders a page for each of the largest funds listed in that bucket's funds.json. Running
# the workflow by hand from the default branch (Actions tab > Web > Run workflow) does the same,
# which is how to redeploy after a data refresh adds funds: the pre-rendered pages and their
# funds list only change when the site is built again.
#
# The build also writes the response headers (dist/_headers), and, from SITE_URL, the canonical links
# of the fund pages, sitemap.xml and robots.txt. The optional variables SITE_URL (the website's
# address, default https://www.orcaetf.com) and HSTS_MAX_AGE (seconds, default six months; 0 undoes
# HSTS) override the defaults. With a VITE_DATA_URL that is an absolute address, the demo data is not
# deployed. See docs/domain-and-data-hosting.md.
#
# The deploy job runs in the `production` environment. In Settings > Environments, restrict it to
# the default branch (deployment branches) and keep CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# there; VITE_DATA_URL, SITE_URL and HSTS_MAX_AGE may be repository or environment variables.

on:
  workflow_dispatch:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: web

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run the unit tests
        run: npx vitest run
      # Not blocking yet: advisories that already exist must not stop a deploy. Make it blocking
      # (drop continue-on-error) once the report is clean.
      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high || { echo "::warning::npm audit found high or critical advisories in production dependencies"; exit 1; }
      - name: Build with the demo data
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the smoke tests
        id: smoke
        run: npx playwright test
      - name: Upload the Playwright report
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    # One deploy at a time; one that has started is never cancelled.
    concurrency:
      group: web-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Fetch funds.json from the data site
        env:
          VITE_DATA_URL: ${{ vars.VITE_DATA_URL }}
        run: |
          if [[ ! "$VITE_DATA_URL" =~ ^https?:// ]]; then
            echo "::error::Set the repository variable VITE_DATA_URL to the data site's URL (https://...)."
            exit 1
          fi
          # The files are brotli-encoded: --compressed makes curl decode them. A 502 or a dropped HTTP/2
          # stream from the data host (seen on 2026-11-11) is brief, so retry any failure, with a pause.
          curl --fail --silent --show-error --compressed --max-time 60 \
            --retry 5 --retry-all-errors --retry-delay 15 \
            --output "$RUNNER_TEMP/funds.json" "${VITE_DATA_URL%/}/funds.json"
      - name: Build
        env:
          VITE_DATA_URL: ${{ vars.VITE_DATA_URL }}
          PRERENDER_FUNDS: ${{ runner.temp }}/funds.json
          # The website's own address: canonical links, sitemap.xml and robots.txt are made from it.
          SITE_URL: ${{ vars.SITE_URL || 'https://www.orcaetf.com' }}
          # Seconds of the Strict-Transport-Security header; unset means six months. 0 undoes it.
          HSTS_MAX_AGE: ${{ vars.HSTS_MAX_AGE }}
        run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          # Secrets pasted with a trailing line break or space break the request: strip them.
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            value="${!v}"
            if [[ "$value" =~ [[:space:]] ]]; then
              echo "::warning::secret $v has a space or line break in it; it is stripped before use, but paste it again without one"
            fi
            export "$v=${value//[[:space:]]/}"
          done
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            # A dashboard address or an endpoint pasted whole still holds the id: take it if it is
            # the only run of exactly 32 hex characters.
            ids="$(grep -oE '[0-9a-f]+' <<<"$CLOUDFLARE_ACCOUNT_ID" | awk 'length == 32' | sort -u)"
            if [ -n "$ids" ] && [ "$(wc -l <<<"$ids")" -eq 1 ]; then
              echo "::add-mask::$ids"
              echo "::warning::CLOUDFLARE_ACCOUNT_ID holds more than the account ID (${#CLOUDFLARE_ACCOUNT_ID} characters); the 32-character ID inside it is used. Paste just the ID to silence this."
              export CLOUDFLARE_ACCOUNT_ID="$ids"
            else
              echo "::error::CLOUDFLARE_ACCOUNT_ID should be the Cloudflare account ID: 32 characters, 0-9 and a-f (it is ${#CLOUDFLARE_ACCOUNT_ID} characters). It is the part before .r2.cloudflarestorage.com in the R2 endpoint, and the Cloudflare dashboard shows it under Workers & Pages (Account ID, right-hand column)."
              exit 1
            fi
          fi
          # The Pages project is made on the first deploy if the account does not have it yet.
          project="${CF_PAGES_PROJECT:-orca}"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 60 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}")"
          if [ "$status" = 404 ]; then
            echo "::notice::creating the Cloudflare Pages project '${project}'"
            npx wrangler pages project create "$project" --production-branch main
          elif [ "$status" != 200 ]; then
            echo "::error::Cloudflare answered HTTP ${status} when asked about the Pages project '${project}': the API token needs the permission Account > Cloudflare Pages > Edit."
            exit 1
          fi
          npx wrangler pages deploy dist --project-name "$project" --branch main
