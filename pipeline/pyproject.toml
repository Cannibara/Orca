[project]
name = "orca"
version = "0.1.0"
description = "Turns SEC 13F filings into per-fund P&L JSON"
requires-python = ">=3.13"
dependencies = [
    "polars",
    "httpx",
    "brotli",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: runs against the real SEC, OpenFIGI, Tiingo and FRED services; needs ORCA_NETWORK=1 and their keys",
]
