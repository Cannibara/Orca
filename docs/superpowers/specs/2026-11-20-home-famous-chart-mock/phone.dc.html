<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home page v4, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;display=swap">
<style>
body{margin:0}
.orca{--ez:cubic-bezier(.2,.7,.2,1);--page:#FAF3EA;--sunken:#F0E6D8;--line:#E6DCCF;--line2:#CDBFAE;--control:#A89C8E;--zero:#6A635A;--ink:#1B1916;--ink2:#4B463F;--ink3:#6A635A;--focus:#0E658C;--inv:#1B1916;--invfg:#FFFCF8;--initBg:#E6DCCF;--initFg:#4B463F}
.orca.dark{--page:#181512;--sunken:#24201B;--line:#2F2A24;--line2:#4A423A;--control:#6F655A;--zero:#AEA498;--ink:#F3ECE3;--ink2:#CBC2B6;--ink3:#AEA498;--focus:#5BA3CE;--inv:#F3ECE3;--invfg:#1B1916;--initBg:#3A342D;--initFg:#CBC2B6}
/* one line per fund: photo, a 136px name block (name over AUM · manager), then the plot */
.orca .cols{display:grid;grid-template-columns:28px 136px minmax(0,1fr);column-gap:8px;align-items:center}
.orca .in{position:absolute;top:0;bottom:0;left:0;right:50px}
.orca .axis{height:36px;box-shadow:0 1px 0 var(--line2)}
.orca .scr{position:relative;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.orca .scr:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.orca .fade{position:absolute;left:0;right:0;height:20px;z-index:6;pointer-events:none;transition:opacity 200ms linear}
.orca .fade.t{top:0;background:linear-gradient(var(--page),transparent)}
.orca .fade.b{bottom:0;background:linear-gradient(transparent,var(--page))}
.orca .row{position:relative;z-index:1;height:48px;color:var(--ink);text-decoration:none}
.orca .row:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.orca .face{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:50% 20%;background:var(--initBg);display:block}
.orca.grey .face{filter:grayscale(1) contrast(1.06)}
.orca .init{display:flex;align-items:center;justify-content:center;font:600 10px/1 'Instrument Sans',sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--initFg)}
.orca .who{display:flex;flex-direction:column;gap:1px;min-width:0}
.orca .nm{font-size:12.5px;line-height:16px;letter-spacing:-.005em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orca .l2{display:flex;align-items:center;gap:5px;min-width:0;font-size:11px;line-height:14px;color:var(--ink3);white-space:nowrap}
.orca .am{flex:none;font-variant-numeric:tabular-nums}
.orca .sep{flex:none;width:3px;height:3px;border-radius:50%;background:var(--control)}
.orca .mg{min-width:0;overflow:hidden;text-overflow:ellipsis}
.orca .plot{position:relative;height:48px}
.orca .bar{position:absolute;top:17px;height:14px;min-width:2px}
.orca .bar.gain{border-radius:0 2px 2px 0}
.orca .bar.loss{border-radius:2px 0 0 2px}
.orca .bar.cut::after{content:"";position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--page);transform:skewX(-20deg)}
.orca .bar.cut.gain::after{right:6px}
.orca .bar.cut.loss::after{left:6px}
.orca .lab{position:absolute;top:0;font:600 11.5px/48px 'Instrument Sans',sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;text-shadow:0 0 2px var(--page),0 0 2px var(--page),0 0 3px var(--page)}
.orca .lab.lead{top:14px;height:20px;padding:0 5px;border-radius:3px;background:var(--inv);color:var(--invfg);font-weight:700;line-height:20px;text-shadow:none}
.orca .grid{position:absolute;inset:0;z-index:0;pointer-events:none}
/* only the zero line and the dotted S&P line are drawn; the other ticks are labels */
.orca .zl{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--zero)}
.orca .spl{position:absolute;top:0;bottom:0;width:1px;margin-left:-.5px;background:repeating-linear-gradient(to bottom,var(--ink3) 0 1.5px,transparent 1.5px 5px);opacity:.75}
.orca .tick{position:absolute;bottom:7px;transform:translateX(-50%);font:400 10.5px/13px 'Instrument Sans',sans-serif;font-variant-numeric:tabular-nums;color:var(--ink3);white-space:nowrap;transition:opacity 200ms linear}
.orca .spx{position:absolute;top:1px;transform:translateX(-50%);font:600 10.5px/13px 'Instrument Sans',sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.orca .spx-m{position:absolute;bottom:0;width:0;height:0;margin-left:-4px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--ink)}
.orca .rule::before{content:"";display:block;width:36px;height:4px;background:var(--ink);margin-bottom:10px}
.orca .seg{display:flex;background:var(--sunken);border-radius:6px;padding:3px;gap:2px}
.orca .seg button{flex:1;border:0;background:transparent;color:var(--ink2);font:500 13px/1 'Instrument Sans',sans-serif;height:38px;border-radius:4px;white-space:nowrap}
.orca .seg button[aria-pressed="true"]{background:var(--page);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(27,25,22,.14)}
.orca a:focus-visible,.orca button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.orca.run-a .bar{animation:growA 600ms var(--ez) backwards}
.orca.run-b .bar{animation:growB 600ms var(--ez) backwards}
.orca.run-a .lab{animation:fadeA 300ms ease-out backwards}
.orca.run-b .lab{animation:fadeB 300ms ease-out backwards}
@keyframes growA{from{transform:scaleX(0)}}
@keyframes growB{from{transform:scaleX(0)}}
@keyframes fadeA{from{opacity:0}}
@keyframes fadeB{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.orca .bar,.orca .lab{animation:none!important}.orca .tick{transition:none}}
</style>
</helmet>
<div class="orca {{rootClass}}" style="width: 400px; height: 844px; box-sizing: border-box; background: var(--page); color: var(--ink); font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif; padding: 20px 16px 16px; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 10px">

<div role="group" aria-label="List" class="seg">
<button type="button" aria-pressed="{{msPressed}}" onClick="{{showMs}}">Most searched</button>
<button type="button" aria-pressed="{{biPressed}}" onClick="{{showBi}}">Buffett inspired</button>
</div>
<div role="group" aria-label="Period" class="seg">
<button type="button" aria-pressed="false">1y</button>
<button type="button" aria-pressed="true">5y</button>
<button type="button" aria-pressed="false">Max</button>
</div>
</div>

<div style="display: flex; align-items: baseline; justify-content: space-between">

<span style="font-size: 11.5px; color: var(--ink3); font-variant-numeric: tabular-nums">{{count}}</span>
</div>
<p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--ink2)">{{lead}}</p>
</div>

<div class="cols axis" aria-hidden="true">
<span></span><span style="align-self: end; padding-bottom: 7px; font: 400 10.5px/13px 'Instrument Sans', sans-serif; color: var(--ink3)">Return a year</span>
<div style="position: relative; height: 36px">
<div class="in">
<sc-for list="{{ticks}}" as="t" hint-placeholder-count="3">
<span class="tick" style="left: {{t.left}}; opacity: {{t.op}}">{{t.label}}</span>
</sc-for>
<span class="spx" style="left: {{spxLeft}}">S&amp;P {{spx}}</span>
<span class="spx-m" style="left: {{spxLeft}}"></span>
</div>
</div>
</div>

<div style="position: relative">
<span class="fade t" style="opacity: {{fadeTop}}"></span>
<div class="scr" tabindex="0" role="region" aria-label="{{scrLabel}}" style="height: {{scrH}}" ref="{{boxRef}}" onScroll="{{onScroll}}" onKeyDown="{{onKey}}">
<div style="position: relative">
<div class="cols grid" aria-hidden="true">
<span></span><span></span>
<div style="position: relative; height: 100%">
<div class="in">
<span class="zl" style="left: {{zeroLeft}}"></span>
<span class="spl" style="left: {{spxLeft}}"></span>
</div>
</div>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<a href="#" class="row cols" aria-label="{{r.aria}}">
<sc-if value="{{r.hasPhoto}}" hint-placeholder-val="{{ true }}">
<img class="face" src="{{r.photo}}" alt="">
</sc-if>
<sc-if value="{{r.noPhoto}}" hint-placeholder-val="{{ false }}">
<span class="face init" aria-hidden="true">{{r.initials}}</span>
</sc-if>
<span class="who" aria-hidden="true">
<span class="nm">{{r.name}}</span>
<span class="l2"><span class="am">{{r.aum}}</span><sc-if value="{{r.hasMgr}}" hint-placeholder-val="{{ true }}"><span class="sep"></span><span class="mg">{{r.mgr}}</span></sc-if></span>
</span>
<span class="plot" aria-hidden="true">
<span class="in">
<span class="bar {{r.kind}} {{r.cut}}" style="left: {{r.left}}; width: {{r.width}}; background: {{r.fill}}; transform-origin: {{r.origin}}; animation-delay: {{r.delay}}"></span>
<span class="lab {{r.leadClass}}" style="left: {{r.lx}}; right: {{r.rx}}; animation-delay: {{r.late}}">{{r.num}}</span>
</span>
</span>
</a>
</sc-for>
</div>
</div>
<span class="fade b" style="opacity: {{fadeBot}}"></span>
</div>
<div style="border-top: 1px solid var(--line2); margin-top: 6px; padding-top: 8px; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 12px; color: var(--ink2)" aria-live="polite">{{caption}}</span>
<span style="font-size: 11px; line-height: 15px; color: var(--ink3)">Source: SEC 13F filings; Orca estimates. S&amp;P 500: SPY price return, Q3 2021 to Q3 2026.</span>
</div>
</div>
</x-dc>

    const s = this.sorted(list), VIS = 10, K = Math.max(1, s.length - VIS + 1);
    const r = [];

    const dark = this.props.dark ?? false;
    const fixed = (this.props.scale ?? 'Fits the funds in view') === 'Same for the whole list';
    const shaded = (this.props.colour ?? 'Shaded by size') === 'Shaded by size';
    const grey = (this.props.photos ?? 'Grey') === 'Grey';
    const st = this.state || {};
    const run = st.run || 0;
    const list = st.list || 'ms';
    const all = this.sorted(list);
    const n = all.length;
    const scroll = n > VIS;
    const p = scroll ? Math.max(0, Math.min(n - VIS, st.p || 0)) : 0;
    const view = Math.round(p);
    const innerW = this.innerW || 138;
    const wl = this.raw(all.map((a) => a[2]), innerW);
    const d = fixed || !scroll ? { lo: wl[0], hi: wl[1] } : this.domAt(list, p, innerW);
    const D0 = d.lo / 100, D1 = d.hi / 100, SPAN = D1 - D0;
    // few labels on a phone: steps of 10 below a 25-pt span, else 20 (so 0 plus one or two round numbers)
    const step = SPAN * 100 > 25 ? 20 : 10;

    const photos = {
      'Warren Buffett': '/_blob/2c096ba4961a158b2e4a05d0f8b9b19a',
      'Charlie Munger': '/_blob/39b5162caa82b7b9329d07a8b494a98e',
      'Ray Dalio': '/_blob/497a4995478706117383c2a471a8a878',
      'Cathie Wood': '/_blob/1efcbe2d8b2f0cbc1d5070edabf2b10f',
      'Bill Gates': '/_blob/7228c59cce6a1234a2643bdbb6eac62a',
      'Bill Ackman': '/_blob/c765d1c2140d30f0901cb327e8b3cda8',
      'Guy Spier': '/_blob/c7269ec90b77a72173c378a171ed2cf2',
      'Jim Simons': '/_blob/a87f2e29a8ed6e51d8c97a90e8f01d4a',
      'Carl Icahn': '/_blob/5a5dcf8833e2c3937003692b1c0073d8',
      'Josh Kushner': '/_blob/58aadc32a7a2ebf11b5f6924da32e90d',
      'David Tepper': '/_blob/881c33132d568ec860dfc612ea1b0bc2',
      'Cliff Asness': '/_blob/e044012e0693acd5ae8e7e55e40c30c9',
      'Brad Gerstner': '/_blob/ac9b26370ac9a764571f7b1cbcf57d3d',
      'Christopher Hohn': '/_blob/c5f10b6ed1489fd41af97293cd9b805d',
      'Nicolai Tangen': '/_blob/0a5bf5992466c9826a7447089d558d1a',
      'Yuri Milner': '/_blob/082e12b7fee27402283c3861c5359e1e'
    };
    const faceOf = { 'Carl Icahn': 'Carl Icahn' };
    // a phone's 136px name column: the names people say for the three that do not fit (full name stays in the label)
    const short = { 'Duquesne Family Office': 'Duquesne', 'Pershing Square Capital': 'Pershing Square', 'Renaissance Technologies': 'Renaissance' };
    const GAIN = dark ? ['#1F5F86', '#3D93C2', '#8CCBEE'] : ['#9CC8E2', '#267CAA', '#0B4A72'];
    const LOSS = dark ? ['#7E3714', '#D9622B', '#F7A882'] : ['#F2B08F', '#C64A14', '#8A3208'];
    const SOLID = dark ? ['#3D93C2', '#F48D60'] : ['#267CAA', '#D4561F'];
    const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
    const mix = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
    const ramp = (s, f) => f <= 0.5 ? mix(s[0], s[1], f / 0.5) : mix(s[1], s[2], (f - 0.5) / 0.5);
    const pct = (x) => (x * 100).toFixed(3) + '%';
    const M = '−';
    const fmt = (r) => (r >= 0 ? '+' : M) + Math.abs(r * 100).toFixed(1) + '%';
    const book = (b) => '$' + b.toFixed(1) + 'B';
    const initials = (s) => s.replace(/[^A-Za-z ]/g, ' ').split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join('');
    const pos = (v) => (Math.max(D0, Math.min(D1, v)) - D0) / SPAN;
    const zero = pos(0);
    const STEP = 40;

    const rows = all.map((a, i) => {
      const [name, mgr, ret, b] = a;
      const up = ret >= 0;
      const start = up ? zero : pos(ret);
      const end = up ? pos(ret) : zero;
      const f = Math.min(Math.abs(ret) / 0.30, 1);
      const face = mgr || faceOf[name];
      const photo = face ? photos[face] : undefined;
      const dl = Math.min(Math.max(i - view, 0), VIS) * STEP;
      return {
        name: short[name] || name, photo, hasPhoto: !!photo, noPhoto: !photo,
        initials: initials(face || name),
        mgr: mgr || '', hasMgr: !!mgr,
        kind: up ? 'gain' : 'loss',
        cut: ret > D1 + 1e-9 || ret < D0 - 1e-9 ? 'cut' : '',
        left: pct(start), width: pct(end - start),
        fill: shaded ? ramp(up ? GAIN : LOSS, 0.15 + 0.85 * f) : (up ? SOLID[0] : SOLID[1]),
        origin: up ? 'left center' : 'right center',
        lx: up ? 'calc(' + pct(end) + ' + 5px)' : 'auto',
        rx: up ? 'auto' : 'calc(' + pct(1 - start) + ' + 5px)',
        leadClass: i === 0 ? 'lead' : '',
        delay: dl + 'ms', late: (dl + 450) + 'ms',
        num: fmt(ret), aum: book(b),
        aria: (i + 1) + ' of ' + n + '. ' + name + (mgr ? ', ' + mgr : '') + ', AUM ' + book(b) + ': ' + (up ? 'gain' : 'loss') + ' of ' + Math.abs(ret * 100).toFixed(1) + '% a year (estimate), ' + (ret > SPX ? 'ahead of' : 'behind') + ' the S&P 500'
      };
    });

    // tick labels only (no gridlines): 0% always, and round numbers on the chosen step, kept clear of the ends
    const ticks = [];
    for (let t = -40; t <= 40; t += 10) {
      const inside = t >= d.lo + 2 && t <= d.hi - 1;
      const on = t === 0 || (inside && t % step === 0);
      ticks.push({
        left: pct(Math.max(-0.1, Math.min(1.1, (t / 100 - D0) / SPAN))),
        label: t === 0 ? '0%' : (t > 0 ? '+' : M) + Math.abs(t) + '%',
        op: on ? 1 : 0
      });
    }

    const beat = all.filter((a) => a[2] > SPX).length, lost = all.filter((a) => a[2] < 0).length;
    const go = (el, t) => { t = Math.max(0, Math.min(n - VIS, t)); this.attach(el); this.glide(t * ROW); };
    const show = (l) => (e) => {
      const root = e && e.currentTarget ? e.currentTarget.closest('.orca') : null;
      const box = root ? root.querySelector('.scr') : null;
      this.stopGlide();
      if (box) box.scrollTop = 0;
      this._T = this._T2 = this._C = 0;
      this.setState({ list: l, p: 0, run: run + 1 });
    };

    return {
      rootClass: [dark ? 'dark' : '', grey ? 'grey' : '', run % 2 ? 'run-b' : 'run-a'].join(' '),
      msPressed: list === 'ms' ? 'true' : 'false', biPressed: list === 'bi' ? 'true' : 'false',
      showMs: show('ms'), showBi: show('bi'),
      name: list === 'bi' ? 'Buffett inspired' : 'Most searched',
      count: n + ' FUNDS',
      lead: (short[all[0][0]] || all[0][0]) + ' leads with ' + fmt(all[0][2]) + ' a year. ' + beat + ' of the ' + n + ' beat the S&P 500' + (lost ? '; ' + lost + ' lost money.' : '; none lost money.'),
      spx: fmt(SPX), spxLeft: pct(pos(SPX)), zeroLeft: pct(zero),
      ticks, rows,
      scrH: scroll ? (VIS * ROW) + 'px' : 'auto',
      scrLabel: 'Funds ' + (view + 1) + ' to ' + Math.min(n, view + VIS) + ' of ' + n + ', scrollable',
      fadeTop: scroll && view > 0 ? 1 : 0,
      fadeBot: scroll && view + VIS < n ? 1 : 0,
      caption: scroll
        ? 'Showing ' + (view + 1) + '–' + (view + VIS) + ' of ' + n + ' · ' + (fixed ? 'same scale for the whole list' : 'scale fits the funds in view')
        : 'All ' + n + ' funds',
      boxRef: this._boxRef || (this._boxRef = (el) => this.attach(el)),
      onScroll: (e) => {
        const el = e.currentTarget;
        this.attach(el);
        if (!this._anim) { this._T = this._T2 = this._C = el.scrollTop; this._v = 0; }
        this._p = el.scrollTop / ROW;
        if (!this._raf) this._raf = requestAnimationFrame(() => { this._raf = 0; this.setState({ p: this._p }); });
      },
      onKey: (e) => {
        if (!scroll) return;
        const el = e.currentTarget;
        const cur = Math.round((this._T == null ? el.scrollTop : this._T) / ROW);
        const k = { ArrowDown: cur + 1, ArrowUp: cur - 1, PageDown: cur + 9, PageUp: cur - 9, Home: 0, End: n - VIS }[e.key];
        if (k === undefined) return;
        e.preventDefault();
        go(el, k);
      }
    };
  }
}
</script>
</body>
</html>
