<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home page v4, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;display=swap">
<style>
body{margin:0}
.orca{--ez:cubic-bezier(.2,.7,.2,1);--page:#FAF3EA;--surface:#FFFCF8;--sunken:#F0E6D8;--band:#F0E6D8;--line:#E6DCCF;--line2:#CDBFAE;--control:#A89C8E;--zero:#6A635A;--ink:#1B1916;--ink2:#4B463F;--ink3:#6A635A;--focus:#0E658C;--inv:#1B1916;--invfg:#FFFCF8;--inv2:#BDB4A8;--initBg:#E6DCCF;--initFg:#4B463F;--up:#0E658C;--down:#B5440F}
.orca.dark{--page:#181512;--surface:#211D19;--sunken:#24201B;--band:#38322B;--line:#2F2A24;--line2:#4A423A;--control:#6F655A;--zero:#AEA498;--ink:#F3ECE3;--ink2:#CBC2B6;--ink3:#AEA498;--focus:#5BA3CE;--inv:#F3ECE3;--invfg:#1B1916;--inv2:#6A635A;--initBg:#3A342D;--initFg:#CBC2B6;--up:#6CB2DB;--down:#F48D60}
.orca .cols{display:grid;grid-template-columns:32px 252px minmax(0,1fr);column-gap:14px;align-items:center}
.orca .in{position:absolute;top:0;bottom:0;left:0;right:56px}
.orca .axis{height:46px;box-shadow:0 1px 0 var(--line2)}
/* the window: 15 rows of 46px, free scrolling (no snap) with a thin scrollbar */
.orca .scr{position:relative;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;border-radius:2px}
.orca .scr:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.orca .fade{position:absolute;left:0;right:0;height:24px;z-index:6;pointer-events:none;transition:opacity 200ms linear}
.orca .fade.t{top:0;background:linear-gradient(var(--page),transparent)}
.orca .fade.b{bottom:0;background:linear-gradient(transparent,var(--page))}
.orca .row{position:relative;z-index:1;height:46px;color:var(--ink);text-decoration:none;border-radius:6px;scroll-snap-align:start}
.orca .row::before{content:"";position:absolute;inset:0 -8px;border-radius:6px;background:var(--band);opacity:0;z-index:-1;transition:opacity 80ms linear}
.orca .row:hover,.orca .row:focus-visible{z-index:3}
.orca .row:hover::before,.orca .row:focus-visible::before{opacity:.6}
.orca .row:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.orca .face{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:50% 20%;background:var(--initBg);display:block;transition:filter 160ms ease-out}
.orca.grey .face{filter:grayscale(1) contrast(1.06)}
.orca.grey .row:hover .face,.orca.grey .row:focus-visible .face{filter:none}
.orca .init{display:flex;align-items:center;justify-content:center;font:600 11px/1 'Instrument Sans',sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--initFg)}
.orca .who{display:flex;flex-direction:column;gap:1px;min-width:0}
.orca .l1{display:flex;align-items:center;gap:7px;min-width:0}
.orca .nm{flex:0 1 auto;min-width:0;font-size:14px;line-height:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orca .sep{flex:none;width:3px;height:3px;border-radius:50%;background:var(--control)}
.orca .am{flex:none;font-size:13px;line-height:18px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.orca .mg{display:flex;align-items:center;gap:6px;min-width:0;font-size:12.5px;line-height:16px;color:var(--ink3);white-space:nowrap}
.orca .mg span{overflow:hidden;text-overflow:ellipsis}
.orca .tag{flex:none;height:16px;padding:0 5px;border-radius:4px;border:1px dashed var(--control);font:500 10.5px/14px 'Instrument Sans',sans-serif;color:var(--ink2);box-sizing:border-box}
.orca .plot{position:relative;height:46px}
/* everything on the scale is placed every frame from the scroll position, so nothing waits on a transition */
.orca .bar{position:absolute;top:14px;height:18px;min-width:2px;container-type:inline-size}
.orca .bar.gain{border-radius:0 3px 3px 0}
.orca .bar.loss{border-radius:3px 0 0 3px}
/* a bar that runs past the scale (only mid-scroll) is drawn broken at the edge; its label keeps the true value */
.orca .bar.cut::after{content:"";position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--page);transform:skewX(-20deg)}
.orca .bar.cut.gain::after{right:7px}
.orca .bar.cut.loss::after{left:7px}
.orca .lab{position:absolute;top:0;font:600 12.5px/46px 'Instrument Sans',sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;text-shadow:0 0 2px var(--page),0 0 2px var(--page),0 0 3px var(--page)}
.orca .lab.lead{top:12px;height:22px;padding:0 6px;border-radius:4px;background:var(--inv);color:var(--invfg);font-weight:700;line-height:22px;text-shadow:none}
.orca .aum{position:absolute;top:0;font:600 10.5px/18px 'Instrument Sans',sans-serif;font-variant-numeric:tabular-nums;color:#FFFFFF;white-space:nowrap}
.orca .bar.gain .aum{right:6px}
.orca .bar.loss .aum{left:6px}
@container (max-width:48px){.orca .aum.s{display:none}}
@container (max-width:56px){.orca .aum.l{display:none}}
.orca .grid{position:absolute;inset:0;z-index:0;pointer-events:none}
.orca .gl{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--line);transition:opacity 200ms linear}
.orca .gl.z{border-left-color:var(--zero)}
/* only the zero line is drawn; the other ticks are labels on the axis */
.orca .gl:not(.z){display:none}
.orca .spl{position:absolute;top:0;bottom:0;width:1px;margin-left:-.5px;background:repeating-linear-gradient(to bottom,var(--ink3) 0 1.5px,transparent 1.5px 5px);opacity:.75}
.orca .spx{position:absolute;top:2px;transform:translateX(-50%);font:600 11px/14px 'Instrument Sans',sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.orca .spx-m{position:absolute;bottom:0;width:0;height:0;margin-left:-5px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid var(--ink)}
.orca .tick{position:absolute;bottom:9px;transform:translateX(-50%);font:400 11px/14px 'Instrument Sans',sans-serif;font-variant-numeric:tabular-nums;color:var(--ink3);white-space:nowrap;transition:opacity 200ms linear}
.orca .tip{position:absolute;left:298px;bottom:calc(100% - 4px);z-index:5;display:none;min-width:190px;max-width:260px;padding:8px 10px;border-radius:6px;background:var(--inv);color:var(--invfg);font:400 12px/1.35 'Instrument Sans',sans-serif;box-shadow:0 4px 14px rgba(27,25,22,.18);pointer-events:none}
.orca .tip.below{bottom:auto;top:calc(100% - 4px)}
.orca .row:hover .tip,.orca .row:focus-visible .tip{display:block}
.orca .tip .t{color:var(--inv2);font-weight:500;margin:0 0 2px}
.orca .tip .v{display:flex;align-items:center;gap:7px;margin-top:3px;font-variant-numeric:tabular-nums}
.orca .tip .v i{width:10px;height:3px;border-radius:2px;display:block;flex:none}
.orca .tip .vl{color:var(--inv2);font-weight:500;flex:1;padding-right:12px}
.orca .tip b{font-weight:700}
.orca .rule::before{content:"";display:block;width:40px;height:4px;background:var(--ink);margin-bottom:12px}
.orca h2{margin:0;font:700 30px/34px 'Instrument Sans',sans-serif;letter-spacing:-.03em}
.orca h3{margin:0;font:700 20px/26px 'Instrument Sans',sans-serif;letter-spacing:-.015em}
.orca.serif h2{font:400 40px/42px 'Instrument Serif',Georgia,serif;letter-spacing:-.01em}
.orca.serif h3{font:400 28px/32px 'Instrument Serif',Georgia,serif;letter-spacing:0}
.orca .tabs a{padding:10px 14px;color:var(--ink3);text-decoration:none}
.orca .tabs a:hover{color:var(--ink)}
.orca .tabs a[aria-current="page"]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
.orca a:focus-visible,.orca button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.orca button{cursor:pointer;font-family:'Instrument Sans',sans-serif}
.orca .seg{display:flex;background:var(--sunken);border-radius:6px;padding:3px;gap:2px}
.orca .seg button{border:0;background:transparent;color:var(--ink2);font-size:13px;font-weight:500;height:32px;padding:0 14px;border-radius:4px;white-space:nowrap}
.orca .seg button[aria-pressed="true"]{background:var(--page);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(27,25,22,.14)}
.orca .btn2{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:500}
.orca .btn2:hover{background:var(--sunken)}
.orca .ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.orca table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.orca th,.orca td{height:36px;padding:0 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.orca thead th{height:30px;font-size:12px;font-weight:500;color:var(--ink3);border-bottom-color:var(--line2)}
.orca th.tl,.orca td.tl{text-align:left}
.orca tbody th{font-weight:600}
/* intro, as the annual chart: bars grow out of zero (600ms, 40ms stagger over the first screen), labels fade in 450ms after their bar */
.orca.run-a .bar{animation:growA 600ms var(--ez) backwards}
.orca.run-b .bar{animation:growB 600ms var(--ez) backwards}
.orca.run-a .lab,.orca.run-a .aum{animation:fadeA 300ms ease-out backwards}
.orca.run-b .lab,.orca.run-b .aum{animation:fadeB 300ms ease-out backwards}
@keyframes growA{from{transform:scaleX(0)}}
@keyframes growB{from{transform:scaleX(0)}}
@keyframes fadeA{from{opacity:0}}
@keyframes fadeB{from{opacity:0}}
@media (prefers-reduced-motion:reduce){
.orca .bar,.orca .lab,.orca .aum{animation:none!important}
.orca .gl,.orca .tick{transition:none!important}
.orca .row::before{transition:none}
}
/* the existing detailed table (today's Famous funds columns) */
.orca .dt-wrap{overflow-x:auto;scrollbar-width:thin}
.orca .dt-wrap:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.orca .dt{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.orca .dt th,.orca .dt td{height:52px;padding:0 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.orca .dt thead th{height:36px;border-bottom-color:var(--line2);font-weight:500}
.orca .dt th.tl{text-align:left;padding-left:0}
.orca .dt th.tl{width:38%}
.orca .dt .sh{all:unset;cursor:pointer;font:500 12px/16px 'Instrument Sans',sans-serif;color:var(--ink3);white-space:nowrap}
.orca .dt .sh:hover{color:var(--ink)}
.orca .dt .sh:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
.orca .dt th[aria-sort="ascending"] .sh,.orca .dt th[aria-sort="descending"] .sh{color:var(--ink);font-weight:600}
.orca .dt .ar{font-weight:500;color:var(--ink3)}
.orca .dt .fr{display:flex;align-items:center;gap:10px;min-width:0;color:var(--ink);text-decoration:none}
.orca .dt .tface{flex:none;width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:50% 20%;background:var(--initBg)}
.orca .dt .fn{display:flex;flex-direction:column;min-width:0}
.orca .dt .tn{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.orca .dt .fr:hover .tn{text-decoration:underline}
.orca .dt .ts{font-weight:400;font-size:12px;line-height:15px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis}
.orca .dt .up{color:var(--up)}
.orca .dt .down{color:var(--down)}
.orca .tpager{display:flex;align-items:center;justify-content:space-between;padding:10px 0 2px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.orca .pgb{height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:6px;background:transparent;color:var(--ink);font:500 12.5px 'Instrument Sans',sans-serif;cursor:pointer}
.orca .pgb:disabled{opacity:.45;cursor:default}
.orca .seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.orca .seg .ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div class="orca {{rootClass}}" style="min-height: 1320px; background: var(--page); color: var(--ink); font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif; padding: 40px 24px 48px; box-sizing: border-box">
<div style="max-width: 1232px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">

<nav class="tabs" aria-label="Home lists" style="display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line2); font-size: 14px">
<a href="#">Top funds</a>
<a href="#" aria-current="page">Famous funds</a>
<a href="#">Conviction moves</a>
<a href="#">Big wins &amp; losses</a>
<a href="#">Crowded buys</a>
<a href="#">Best &amp; worst calls</a>
</nav>

<header style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<h2>Famous funds</h2>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink2)">{{standfirst}}</p>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div role="group" aria-label="List" class="seg">
<button type="button" aria-pressed="{{msPressed}}" onClick="{{showMs}}">Most searched</button>
<button type="button" aria-pressed="{{biPressed}}" onClick="{{showBi}}">Buffett inspired</button>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<div role="group" aria-label="Period" class="seg">
<button type="button" aria-pressed="false">1y</button>
<button type="button" aria-pressed="true">5y</button>
<button type="button" aria-pressed="false">Max</button>
</div>
<div role="group" aria-label="View" class="seg">
<button type="button" aria-pressed="{{chartPressed}}" onClick="{{showChart}}"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M3 8h7M3 11.5h4"></path></svg>Chart</button>
<button type="button" aria-pressed="{{tablePressed}}" onClick="{{showTable}}"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1.5"></rect><path d="M2.5 6.5h11M6.5 6.5V13"></path></svg>Table</button>
</div>
</div>
</div>
</header>

<figure aria-label="{{g.name}}" style="margin: 0; display: flex; flex-direction: column; min-width: 0">
<div class="rule" style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
<h3>{{g.name}}</h3>
<span style="font-size: 12px; color: var(--ink3); font-variant-numeric: tabular-nums">{{g.count}}</span>
</div>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink2)">{{g.lead}}</p>
</div>

<sc-if value="{{chart}}" hint-placeholder-val="{{ true }}">
<div>
<div style="min-width: 0">
<div class="cols axis" aria-hidden="true">
<span></span><span></span>
<div style="position: relative; height: 46px">
<div class="in">
<sc-for list="{{ticks}}" as="t" hint-placeholder-count="6">
<span class="tick" style="left: {{t.left}}; opacity: {{t.op}}">{{t.label}}</span>
</sc-for>
<span class="spx" style="left: {{spxLeft}}">S&amp;P 500 {{spx}}</span>
<span class="spx-m" style="left: {{spxLeft}}"></span>
</div>
</div>
</div>

<div style="position: relative">
<span class="fade t" style="opacity: {{fadeTop}}"></span>
<div class="scr" tabindex="0" role="region" aria-label="{{scrLabel}}" style="height: {{scrH}}" ref="{{boxRef}}" onScroll="{{onScroll}}" onKeyDown="{{onKey}}">
<div style="position: relative">
<div class="cols grid" aria-hidden="true">
<span></span><span></span>
<div style="position: relative; height: 100%">
<div class="in">
<sc-for list="{{ticks}}" as="t" hint-placeholder-count="6">
<span class="gl {{t.cls}}" style="left: {{t.left}}; opacity: {{t.op}}"></span>
</sc-for>
<span class="spl" style="left: {{spxLeft}}"></span>
</div>
</div>
</div>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="15">
<a href="#" class="row cols" aria-label="{{r.aria}}">
<sc-if value="{{r.hasPhoto}}" hint-placeholder-val="{{ true }}">
<img class="face" src="{{r.photo}}" alt="">
</sc-if>
<sc-if value="{{r.noPhoto}}" hint-placeholder-val="{{ false }}">
<span class="face init" aria-hidden="true">{{r.initials}}</span>
</sc-if>
<span class="who" aria-hidden="true">
<span class="l1"><span class="nm">{{r.name}}</span><sc-if value="{{aumName}}" hint-placeholder-val="{{ true }}"><span class="sep"></span><span class="am">{{r.aum}}</span></sc-if></span>
<sc-if value="{{r.hasMgr}}" hint-placeholder-val="{{ true }}"><span class="mg"><span>{{r.mgr}}</span></span></sc-if>
</span>
<span class="plot" aria-hidden="true">
<span class="in">
<span class="bar {{r.kind}} {{r.cut}}" style="left: {{r.left}}; width: {{r.width}}; background: {{r.fill}}; transform-origin: {{r.origin}}; animation-delay: {{r.delay}}"><sc-if value="{{aumIn}}" hint-placeholder-val="{{ false }}"><span class="aum {{r.aumCls}}" style="animation-delay: {{r.late}}">{{r.aum}}</span></sc-if></span>
<span class="lab {{r.leadClass}}" style="left: {{r.lx}}; right: {{r.rx}}; animation-delay: {{r.late}}">{{r.num}}</span>
</span>
</span>
<span class="tip {{r.tipCls}}" aria-hidden="true">
<p class="t">{{r.full}}</p>
<span class="v"><i style="background: {{r.fill}}"></i><span class="vl">Return a year</span><b>{{r.num}}</b></span>
<span class="v"><i></i><span class="vl">vs S&amp;P 500</span><b>{{r.vs}}</b></span>
<span class="v"><i></i><span class="vl">AUM</span><b>{{r.aum}}</b></span>
</span>
</a>
</sc-for>
</div>
</div>
<span class="fade b" style="opacity: {{fadeBot}}"></span>
</div>
<p style="margin: 10px 0 0; font-size: 12px; line-height: 16px; color: var(--ink3)" aria-live="polite">{{caption}}</p>
</div>

</div>
</sc-if>

<sc-if value="{{table}}" hint-placeholder-val="{{ false }}">
<div class="dt-wrap" tabindex="0" role="region" aria-label="{{g.name}} table, scrolls sideways">
<table class="dt">
<caption style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{g.name}}: estimated figures, {{sortSay}}</caption>
<thead><tr>
<sc-for list="{{tcols}}" as="c" hint-placeholder-count="7"><th scope="col" class="{{c.cls}}" aria-sort="{{c.aria}}"><button type="button" class="sh" onClick="{{c.sort}}">{{c.label}}<span class="ar">{{c.arrow}}</span></button></th></sc-for>
</tr></thead>
<tbody>
<sc-for list="{{trows}}" as="r" hint-placeholder-count="10">
<tr>
<th scope="row" class="tl"><a href="#" class="fr" title="{{r.full}}"><sc-if value="{{r.hasPhoto}}" hint-placeholder-val="{{ true }}"><img class="tface" src="{{r.photo}}" alt=""></sc-if><sc-if value="{{r.noPhoto}}" hint-placeholder-val="{{ false }}"><span class="tface init" aria-hidden="true">{{r.initials}}</span></sc-if><span class="fn"><span class="tn">{{r.name}}</span><sc-if value="{{r.hasSub}}" hint-placeholder-val="{{ true }}"><span class="ts">{{r.sub}}</span></sc-if></span></a></th>
<sc-if value="{{isMs}}" hint-placeholder-val="{{ true }}"><td>{{r.search}}</td></sc-if>
<td>{{r.aumT}}</td><td>{{r.pos}}</td><td><span class="{{r.retCls}}">{{r.ret0}}</span></td><td>{{r.dd}}</td><td>{{r.sharpe}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<div class="tpager">
<span>{{tRange}}</span>
<div style="display: flex; gap: 6px">
<button type="button" class="pgb" disabled="{{prevOff}}" onClick="{{prevPage}}">Previous</button>
<button type="button" class="pgb" disabled="{{nextOff}}" onClick="{{nextPage}}">Next</button>
</div>
</div>
</sc-if>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line2)">
<span style="font-size: 12px; line-height: 16px; color: var(--ink3)">Source: SEC 13F filings; Orca estimates. S&amp;P 500: SPY price return, Q3 2021 to Q3 2026.</span>
</div>
</figure>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px">
<p style="margin: 0; font-size: 12px; color: var(--ink3)">Real 5-year figures from data.orcaetf.com (Q3 2026 filings). Scroll the list or use the arrow / Page keys. Home page v4 mock-up.</p>
<button type="button" onClick="{{replay}}" style="height: 32px; padding: 0 12px; border: 1px dashed var(--line2); border-radius: 6px; background: transparent; color: var(--ink2); font-size: 12px">Replay animation (mock-up only)</button>
</div>
</div>

        initials: initials(face || name),
        mgr: mgr || '', hasMgr: !!mgr,
        stopped: until != null, until: until != null ? qLabel(until) : '',
        hasSub: !!mgr || until != null,
        kind: up ? 'gain' : 'loss',
        cut: ret > D1 + 1e-9 || ret < D0 - 1e-9 ? 'cut' : '',
        left: pct(start), width: pct(end - start), fill,
        origin: up ? 'left center' : 'right center',
        lx: up ? 'calc(' + pct(end) + ' + 6px)' : 'auto',
        rx: up ? 'auto' : 'calc(' + pct(1 - start) + ' + 6px)',
        leadClass: i === 0 ? 'lead' : '',
        tipCls: scroll && i - view < 2 ? 'below' : '',
        delay: dl + 'ms', late: (dl + 450) + 'ms',
        num: fmt(ret), vs: pp(ret - SPX), aum: book(b), aumCls: book(b).length > 6 ? 'l' : 's',
        aria: (i + 1) + ' of ' + n + '. ' + name + (mgr ? ', ' + mgr : '') + ', AUM ' + book(b) + ': ' + (up ? 'gain' : 'loss') + ' of ' + Math.abs(ret * 100).toFixed(1) + '% a year (estimate), ' + (ret > SPX ? 'ahead of' : 'behind') + ' the S&P 500' + (i === 0 ? ', best in this list' : '')
      };
    });

    // one stable set of candidate ticks (every 5 pts), so a tick keeps its element: it slides with the scale and fades in or out
    const ticks = [];
    for (let t = -50; t <= 50; t += 5) {
      const inside = t >= d.lo + 1 && t <= d.hi - 0.5;
      const on = t === 0 || (inside && t % step === 0);
      ticks.push({
        left: pct(Math.max(-0.08, Math.min(1.08, (t / 100 - D0) / SPAN))),
        label: t === 0 ? '0%' : (t > 0 ? '+' : M) + Math.abs(t) + '%',
        op: on ? 1 : 0,
        cls: t === 0 ? 'z' : ''
      });
    }

    const lead = (() => {
      const beat = all.filter((a) => a[2] > SPX).length, lost = all.filter((a) => a[2] < 0).length;
      return all[0][0] + ' leads with ' + fmt(all[0][2]) + ' a year. ' + beat + ' of the ' + n + ' beat the S&P 500' + (lost ? '; ' + lost + ' lost money.' : '; none lost money.');
    })();


    // ---- the existing detailed table (today's Famous funds columns), behind the Chart / Table switch ----
    const isMs = list === 'ms';
    const fBook = (b) => { const a = b * 1e9, m = Math.round(a / 1e6); return m >= 1000 ? '$' + (a / 1e9).toFixed(1) + 'B' : '$' + m.toLocaleString('en-US') + 'm'; };
    const pct0 = (x, signed) => { const t = Math.abs(x * 100).toFixed(0); return (Number(t) === 0 ? '' : x < 0 ? M : signed ? '+' : '') + t + '%'; };
    const ratio = (x) => x == null ? '—' : (x < 0 && Number(Math.abs(x).toFixed(2)) !== 0 ? M : '') + Math.abs(x).toFixed(2);
    const fSearch = (x) => x == null ? '—' : x >= 9.95 ? String(Math.round(x)) : x >= 0.95 ? x.toFixed(1) : x > 0 ? '<1' : '0';
    const qL = (q) => 'Q' + ((q % 4) + 1) + ' ' + (2013 + Math.floor(q / 4));
    // most popular: Google Trends score, then size (as the live site's popularity order)
    const popOrder = all.slice().sort((x, y) => ((y[10] || 0) - (x[10] || 0)) || (y[3] - x[3]));
    const popRank = new Map(popOrder.map((a, i) => [a, i]));
    const keyFn = {
      name: (a) => a[0].toLowerCase(), pop: (a) => -popRank.get(a), search: (a) => a[6], book: (a) => a[3],
      positions: (a) => a[7], ret: (a) => a[2], dd: (a) => a[8], sharpe: (a) => a[9]
    };
    const sort = st.sort || (isMs ? { key: 'search', dir: -1 } : { key: 'pop', dir: -1 });
    const tSorted = all.slice().sort((x, y) => {
      const a = keyFn[sort.key](x), b = keyFn[sort.key](y);
      if (a == null && b == null) return 0; if (a == null) return 1; if (b == null) return -1;
      return (a < b ? -1 : a > b ? 1 : 0) * sort.dir;
    });
    const PAGE = 10, pages = Math.max(1, Math.ceil(n / PAGE));
    const page = Math.min(st.page || 0, pages - 1);
    const colDefs = [{ key: 'name', label: 'Fund', cls: 'tl' }]
      .concat(isMs ? [{ key: 'search', label: 'Search interest' }] : [])
      .concat([{ key: 'book', label: 'AUM' }, { key: 'positions', label: 'Positions' }, { key: 'ret', label: 'Return / yr' }, { key: 'dd', label: 'Max Drawdown' }, { key: 'sharpe', label: 'Sharpe' }]);
    const nextSort = (k) => {
      if (k === 'name') return sort.key === 'name' && sort.dir === 1 ? { key: 'name', dir: -1 } : sort.key === 'name' ? { key: 'pop', dir: -1 } : { key: 'name', dir: 1 };
      return sort.key === k ? { key: k, dir: -sort.dir } : { key: k, dir: -1 };
    };
    const tcols = colDefs.map((c) => {
      const on = sort.key === c.key || (c.key === 'name' && sort.key === 'pop');
      return {
        label: c.label, cls: c.cls || '',
        arrow: !on ? '' : sort.key === 'pop' ? ' · most popular' : sort.dir < 0 ? ' ↓' : ' ↑',
        aria: !on ? 'none' : sort.dir < 0 ? 'descending' : 'ascending',
        sort: () => this.setState({ sort: nextSort(c.key), page: 0 })
      };
    });
    const trows = tSorted.slice(page * PAGE, page * PAGE + PAGE).map((a) => {
      const [name, mgr, ret, b, until, full, search, npos, dd, sh] = a;
      const face = mgr || faceOf[name];
      const photo = face ? photos[face] : undefined;
      const sub = [mgr, until != null ? 'filed until ' + qL(until) : null].filter(Boolean).join(' · ');
      return {
        name, full, photo, hasPhoto: !!photo, noPhoto: !photo, initials: initials(face || name),
        sub, hasSub: sub !== '',
        search: fSearch(search), aumT: fBook(b), pos: npos == null ? '—' : npos.toLocaleString('en-US'),
        ret0: pct0(ret, true), retCls: Number(Math.abs(ret * 100).toFixed(0)) === 0 ? '' : ret > 0 ? 'up' : 'down',
        dd: dd == null ? '—' : pct0(dd, false), sharpe: ratio(sh)
      };
    });
    const go = (el, t) => {
      t = Math.max(0, Math.min(n - VIS, t));
      this.attach(el);
      this.glide(t * ROW);
    };
    const show = (l) => (e) => {
      const box = e && e.currentTarget && e.currentTarget.closest('.orca') ? e.currentTarget.closest('.orca').querySelector('.scr') : null;
      clearTimeout(this._t);
      this.stopGlide();
      if (box) box.scrollTop = 0;
      this._T = this._T2 = this._C = 0;
      this.setState({ list: l, p: 0, run: run + 1, sort: null, page: 0 });
    };

    return {
      rootClass: [dark ? 'dark' : '', grey ? 'grey' : '', serif ? 'serif' : '', run % 2 ? 'run-b' : 'run-a'].join(' '),
      replay: () => this.setState({ run: run + 1 }),
      table, chart: !table,
      tablePressed: table ? 'true' : 'false', chartPressed: table ? 'false' : 'true',
      showTable: () => this.setState({ table: true }),
      showChart: () => this.setState({ table: false, run: table ? run + 1 : run }),
      isMs, tcols, trows,
      standfirst: table ? 'Estimated figures over the last 5 years. Select a heading to sort; Fund steps through A–Z, Z–A and most popular.' : 'Estimated return a year over the last 5 years, best first. The dotted line is the S&P 500 (' + fmt(SPX) + ').',
      tRange: (page * PAGE + 1) + '–' + Math.min(n, page * PAGE + PAGE) + ' of ' + n,
      prevOff: page === 0, nextOff: page >= pages - 1,
      prevPage: () => this.setState({ page: Math.max(0, page - 1) }),
      nextPage: () => this.setState({ page: Math.min(pages - 1, page + 1) }),
      sortSay: sort.key === 'pop' ? 'most popular first' : 'sorted by ' + colDefs.find((c) => c.key === sort.key).label + (sort.dir < 0 ? ', high to low' : ', low to high'),
      msPressed: list === 'ms' ? 'true' : 'false', biPressed: list === 'bi' ? 'true' : 'false',
      showMs: show('ms'), showBi: show('bi'),
      aumName: !aumIn, aumIn,
      spx: fmt(SPX), spxLeft: pct(pos(SPX)),
      ticks, scroll, n,
      scrH: scroll ? (VIS * ROW) + 'px' : 'auto',
      scrLabel: 'Funds ' + (view + 1) + ' to ' + Math.min(n, view + VIS) + ' of ' + n + ', scrollable',
      fadeTop: scroll && view > 0 ? 1 : 0,
      fadeBot: scroll && view + VIS < n ? 1 : 0,
      caption: scroll
        ? 'Showing ' + (view + 1) + '–' + (view + VIS) + ' of ' + n + ' · ' + (fixed ? 'same scale for the whole list' : 'scale fits the funds in view')
        : 'All ' + n + ' funds',
      // scroll: one update per frame; the scale is a smooth function of the scroll position
      boxRef: this._boxRef || (this._boxRef = (el) => this.attach(el)),
      onScroll: (e) => {
        const el = e.currentTarget;
        this.attach(el);
        // a scroll the spring did not drive (scrollbar drag, touch): follow it
        if (!this._anim) { this._T = this._T2 = this._C = el.scrollTop; this._v = 0; }
        this._p = el.scrollTop / ROW;
        if (!this._raf) this._raf = requestAnimationFrame(() => { this._raf = 0; this.setState({ p: this._p }); });
      },
      onKey: (e) => {
        if (!scroll) return;
        const el = e.currentTarget;
        const cur = Math.round((this._T == null ? el.scrollTop : this._T) / ROW);
        const k = { ArrowDown: cur + 1, ArrowUp: cur - 1, PageDown: cur + 14, PageUp: cur - 14, Home: 0, End: n - VIS }[e.key];
        if (k === undefined) return;
        e.preventDefault();
        go(el, k);
      },
      g: { name: list === 'bi' ? 'Buffett inspired' : 'Most searched', count: n + ' FUNDS', lead, rows }
    };
  }
}
</script>
</body>
